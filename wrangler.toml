name = "panel"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PANEL_CODE = "YUVI_001"
PANEL_NAME = "YUVI PANEL"
MAK_SERVER_NAME = "MUNDO Activation"
MAK_SIGNING_KEY_ID = "MAK-ED25519-01"
# Origin of the frontend app (e.g. "https://panel.example.com") — only
# needed when it is cross-origin to this Worker.
# Required for cross-origin /api/* calls with credentials. Same-origin
# deployments can leave this empty.
FRONTEND_ORIGIN = ""

# Secrets (NEVER commit values here). Set via:
#   wrangler secret put BCORE_SECRET
#   wrangler secret put MUNDO_SALT
#   wrangler secret put ARCX_TOKEN_SALT
#   wrangler secret put OPENCODE_ENC_KEY   # 64 hex chars, from OpenCodeAndroid/.panel-secret
#   wrangler secret put OPENCODE_ADMIN_PASSWORD  # standalone /opencode admin login
#   wrangler secret put MAK_SIGNING_KEY    # base64 32-byte Ed25519 seed
#   wrangler secret put IP_HASH_SALT       # optional, hashes client IPs in logs
# Legacy fallbacks in src/crypto.js / src/p-connect.js keep old clients
# working until a documented rotation. See SECURITY.md.

# Temporary remote debugging ONLY: set to "1" to include the exception
# message in /connect + /encrypt 500 responses. REMOVE after debugging —
# it leaks internals by design.
# DEBUG_ERRORS = "1"

[[d1_databases]]
binding = "DB"
database_name = "panel"
database_id = "eb874adb-1e9a-413b-bff6-3f4fd5b262ab"
