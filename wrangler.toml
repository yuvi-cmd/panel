name = "mak-panel"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PANEL_NAME = "MUNDO MAK"
MAK_SERVER_NAME = "MUNDO Activation"
MAK_SIGNING_KEY_ID = "MAK-ED25519-01"
# Optional: require this code on /setup. Set as a secret instead if possible:
#   wrangler secret put SETUP_CODE
# SETUP_CODE = "change-me-before-first-run"

# Secrets (NEVER commit values):
#   wrangler secret put MAK_SIGNING_KEY          # base64 32-byte Ed25519 seed
#   wrangler secret put MAK_SIGNING_KEYS         # optional JSON key ring for rotation
#   wrangler secret put IP_HASH_SALT             # optional, hashes client IPs in logs
#   wrangler secret put SETUP_CODE               # optional first-run gate
#
# Generate a signing key:
#   npm run keys

[[d1_databases]]
binding = "DB"
database_name = "panel"
database_id = "eb874adb-1e9a-413b-bff6-3f4fd5b262ab"
